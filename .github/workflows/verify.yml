name: Verify core and generator
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            generator/package-lock.json
      - run: npm ci
      - run: npm --prefix generator ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run generator:build
      - run: npm run generate:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
